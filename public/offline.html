<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183D2A" />
    <title>HUUEL - Offline</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #1f2937;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        width: min(92vw, 520px);
        border: 1px solid #d1d5db;
        background: #ffffff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        color: #183d2a;
        font-size: 22px;
      }
      p {
        margin: 8px 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Voce esta offline</h1>
      <p>A interface principal foi carregada do cache.</p>
      <p>Assim que a conexao voltar, os dados pendentes serao sincronizados automaticamente.</p>
    </div>
  </body>
</html>
